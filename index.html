const STEP=400;                      // durasi tiap frame (ms), sama seperti GIF asli
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ease=t=>t*t*(3-2*t);           // smoothstep: transisi antar frame jadi halus

function fit(){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
}
addEventListener('resize',fit);

Promise.all(FRAMES.map(src=>new Promise(res=>{
  const i=new Image(); i.onload=()=>res(i); i.src=src;
}))).then(imgs=>{
  fit();
  const n=imgs.length, loop=n*STEP;
  function draw(now){
    const t=now%loop, i=Math.floor(t/STEP), a=ease((t%STEP)/STEP);
    ctx.globalAlpha=1; ctx.drawImage(imgs[i],0,0,cv.width,cv.height);
    ctx.globalAlpha=a;  ctx.drawImage(imgs[(i+1)%n],0,0,cv.width,cv.height);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
});
</script>
