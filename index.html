<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Rose Animation</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #fbfbf8;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  svg { height: 100vh; width: auto; max-width: 100vw; }
  svg * { transform-origin: 0 0; }

  /* Semua animasi hanya berjalan saat .go aktif (supaya bisa di-replay) */
  .stem, .leaf, .thorn, .calyx, .bud, .rose, .p, .fall { opacity: 0; }

  /* 1. Batang tumbuh */
  .go .stem { opacity: 1; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 2.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* 2. Daun & duri muncul */
  .go .leaf { animation: grow 1.2s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--d); }
  .go .thorn { animation: grow .5s ease-out forwards; animation-delay: var(--d); }
  @keyframes grow { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

  /* 3. Kuncup */
  .go .calyx { animation: fadeIn .8s ease-out 2.2s forwards; }
  .go .bud { animation: bud 1.6s ease-out 2.4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes bud {
    0%   { opacity: 0; transform: scale(.2); }
    40%  { opacity: 1; transform: scale(1); }
    75%  { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* 4. Mekar */
  .go .rose { animation: bloom 3.4s cubic-bezier(.2,.7,.3,1) 3.4s forwards,
                         sway 4s ease-in-out 7s infinite alternate; }
  @keyframes bloom { from { opacity: 1; transform: scale(.35); } to { opacity: 1; transform: scale(1); } }
  @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  .go .p { animation: open 2.6s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--d); }
  @keyframes open { from { opacity: 0; transform: scale(.1); } to { opacity: 1; transform: scale(1); } }

  /* 5. Kelopak berguguran */
  .go .fall { animation: fall 5s ease-in infinite; animation-delay: var(--d); }
  @keyframes fall {
    0%   { opacity: 0; transform: translate(var(--x0), var(--y0)) rotate(0deg); }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--x1), 500px) rotate(var(--r)); }
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" aria-label="Mawar merah tumbuh dan mekar">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="100%" r="110%">
      <stop offset="0" stop-color="#5a0510"/>
      <stop offset=".55" stop-color="#a8101f"/>
      <stop offset="1" stop-color="#d92a38"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f4a1f"/>
      <stop offset="1" stop-color="#5a7a35"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d4620"/>
      <stop offset=".5" stop-color="#587a34"/>
      <stop offset="1" stop-color="#2d4620"/>
    </linearGradient>

    <!-- bentuk satu kelopak (menghadap ke atas dari titik 0,0) -->
    <g id="pt">
      <path d="M0 0 C-52 -8 -60 -64 0 -70 C60 -64 52 -8 0 0Z" fill="url(#petalGrad)" stroke="#4a0410" stroke-opacity=".45" stroke-width="1.5"/>
      <path d="M-34 -52 C-14 -64 14 -64 34 -52" fill="none" stroke="#ff6b78" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- daun -->
    <g id="lf">
      <path d="M0 0 C20 -30 75 -32 108 -4 C75 20 28 20 0 0Z" fill="url(#leafGrad)" stroke="#223514" stroke-width="1.5"/>
      <path d="M4 0 C40 -4 75 -4 104 -4" fill="none" stroke="#8fae5c" stroke-opacity=".7" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Batang -->
  <path class="stem" pathLength="1" d="M200 515 C195 440 206 340 200 258"
        fill="none" stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Duri -->
  <g transform="translate(203,430) rotate(-60)"><path class="thorn" style="--d:1.3s" d="M0 -3 L12 0 L0 3Z" fill="#3b5a27"/></g>
  <g transform="translate(197,370) rotate(-120)"><path class="thorn" style="--d:1.6s" d="M0 -3 L12 0 L0 3Z" fill="#3b5a27"/></g>
  <g transform="translate(203,310) rotate(-60)"><path class="thorn" style="--d:1.9s" d="M0 -3 L11 0 L0 3Z" fill="#3b5a27"/></g>

  <!-- Daun -->
  <g transform="translate(202,395) rotate(-12)"><use class="leaf" style="--d:1.5s" href="#lf"/></g>
  <g transform="translate(198,352) scale(-1,1) rotate(12)"><use class="leaf" style="--d:1.8s" href="#lf" /></g>
  <g transform="translate(202,315) rotate(-35) scale(.75)"><use class="leaf" style="--d:2.1s" href="#lf"/></g>

  <!-- Kelopak hijau (calyx) -->
  <g transform="translate(200,258)" class="calyx">
    <path d="M0 0 C-30 -4 -42 -28 -38 -44 C-24 -30 -10 -22 0 -16Z" fill="#3f5f28" stroke="#223514" stroke-width="1.2"/>
    <path d="M0 0 C30 -4 42 -28 38 -44 C24 -30 10 -22 0 -16Z" fill="#3f5f28" stroke="#223514" stroke-width="1.2"/>
    <ellipse cx="0" cy="-4" rx="12" ry="14" fill="#587a34"/>
  </g>

  <!-- Kuncup -->
  <g transform="translate(200,252)">
    <g class="bud">
      <path d="M0 0 C-22 -10 -20 -48 0 -66 C20 -48 22 -10 0 0Z" fill="url(#petalGrad)" stroke="#4a0410" stroke-opacity=".5" stroke-width="1.5"/>
      <path d="M-6 -12 C-12 -30 -4 -48 0 -58" fill="none" stroke="#ff6b78" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Mawar mekar -->
  <g transform="translate(200,205)">
    <g class="rose">
      <!-- lapis luar -->
      <g transform="rotate(0)"><use class="p" style="--d:3.9s" href="#pt"/></g>
      <g transform="rotate(72)"><use class="p" style="--d:3.8s" href="#pt"/></g>
      <g transform="rotate(144)"><use class="p" style="--d:3.7s" href="#pt"/></g>
      <g transform="rotate(216)"><use class="p" style="--d:3.8s" href="#pt"/></g>
      <g transform="rotate(288)"><use class="p" style="--d:3.9s" href="#pt"/></g>
      <!-- lapis tengah -->
      <g transform="rotate(36) scale(.78)"><use class="p" style="--d:4.3s" href="#pt"/></g>
      <g transform="rotate(108) scale(.78)"><use class="p" style="--d:4.4s" href="#pt"/></g>
      <g transform="rotate(180) scale(.78)"><use class="p" style="--d:4.2s" href="#pt"/></g>
      <g transform="rotate(252) scale(.78)"><use class="p" style="--d:4.4s" href="#pt"/></g>
      <g transform="rotate(324) scale(.78)"><use class="p" style="--d:4.3s" href="#pt"/></g>
      <!-- lapis dalam -->
      <g transform="rotate(10) scale(.52)"><use class="p" style="--d:4.8s" href="#pt"/></g>
      <g transform="rotate(100) scale(.52)"><use class="p" style="--d:4.9s" href="#pt"/></g>
      <g transform="rotate(190) scale(.52)"><use class="p" style="--d:4.8s" href="#pt"/></g>
      <g transform="rotate(280) scale(.52)"><use class="p" style="--d:4.9s" href="#pt"/></g>
      <!-- pusat spiral -->
      <g transform="scale(.28) rotate(40)"><use class="p" style="--d:5.2s" href="#pt"/></g>
      <g transform="scale(.28) rotate(200)"><use class="p" style="--d:5.3s" href="#pt"/></g>
    </g>
  </g>

  <!-- Kelopak jatuh -->
  <path class="fall" style="--d:7s;--x0:140px;--y0:240px;--x1:60px;--r:300deg"
        d="M0 0 C-10 -8 -6 -22 4 -24 C16 -20 14 -4 0 0Z" fill="#c8202e" transform-origin="0 0"/>
  <path class="fall" style="--d:8.8s;--x0:270px;--y0:200px;--x1:340px;--r:-260deg"
        d="M0 0 C-10 -8 -6 -22 4 -24 C16 -20 14 -4 0 0Z" fill="#b5192a"/>
  <path class="fall" style="--d:10.2s;--x0:250px;--y0:260px;--x1:300px;--r:220deg"
        d="M0 0 C-10 -8 -6 -22 4 -24 C16 -20 14 -4 0 0Z" fill="#d42a38"/>
  <path class="fall" style="--d:11.5s;--x0:130px;--y0:210px;--x1:90px;--r:-200deg"
        d="M0 0 C-10 -8 -6 -22 4 -24 C16 -20 14 -4 0 0Z" fill="#a8101f"/>
</svg>

<script>
  // Putar ulang animasi otomatis setiap 20 detik, atau saat layar diklik
  const scene = document.getElementById('scene');
  let timer;
  function play() {
    clearTimeout(timer);
    scene.classList.remove('go');
    void scene.getBoundingClientRect(); // reset animasi
    scene.classList.add('go');
    timer = setTimeout(play, 20000);
  }
  document.body.addEventListener('click', play);
  play();
</script>
</body>
</html>
